<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0b12">
<meta name="robots" content="noindex">
<title>Players' view · Ragnar's Den</title>
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="images/icon-192.png">
<link rel="stylesheet" href="css/pages/dungeon-view.css">
</head>
<body>
<!-- The players' screen: the dungeon the DM presents, under fog except
     what the DM has shown. Opened from a map's Player view button. -->
<canvas id="pv-map" aria-label="Dungeon map"></canvas>

<div id="pv-wait" hidden>
  <div class="pv-wait-name" id="pv-wait-name"></div>
  <div class="pv-wait-text" id="pv-wait-text"></div>
</div>

<button id="pv-full" type="button" title="Full screen (F)" aria-label="Full screen">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path class="pv-enter" d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/>
    <path class="pv-exit" d="M8 3v3a2 2 0 0 1-2 2H3M21 8h-3a2 2 0 0 1-2-2V3M3 16h3a2 2 0 0 1 2 2v3M16 21v-3a2 2 0 0 1 2-2h3"/>
  </svg>
</button>

<script type="module" src="js/dungeon-view.js"></script>
</body>
</html>
